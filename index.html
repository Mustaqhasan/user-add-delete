<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Document</title>
  </head>
  <body>
    <div id="container">
      <h1>New Employees</h1>
      <form action="" class="row g-3">
        <!-- <label for="name">Enter Name</label> -->

        <div class="col-md-4">
          <label for="name" class="form-label">Enter Name</label>
          <input type="text" class="form-control" id="name" />
        </div>
        <div class="col-md-4">
          <label for="profession" class="form-label">Enter Profession</label>
          <input type="text" class="form-control" id="profession" />
        </div>
        <div class="col-md-4">
          <label for="age" class="form-label">Enter Age</label>
          <input type="number" class="form-control" id="age" />
        </div>
        <div class="col-12">
          <button onclick="addUser()" type="button" class="btn btn-success">Add User</button>
        </div>
      </form>
      <p id="message"></p>
      <h3>Added Employees</h3>
      <p id="counter">You have 0 Employees</p>
      <div id="res">

      </div>
    </div>
    


    <script src="./script.js"></script>
  </body>
</html>
